<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roblox UI Designer | Portfolio</title>
  <meta name="description" content="Portfolio of Roblox game UI: shops, crafting menus, class select screens and interface animation.">
  <meta name="theme-color" content="#0b0a0f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffb62e'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' fill='%230b0a0f' transform='rotate(12 16 16)'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-loading">
  <div class="ambient" aria-hidden="true"><i class="blob blob-a"></i><i class="blob blob-b"></i></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="curtain" aria-hidden="true"><span class="curtain-count">0</span></div>
  <div class="progress" aria-hidden="true"><i></i></div>
  <div class="cursor" aria-hidden="true"><span></span></div>

  <header class="top">
    <a class="brand" href="#top" data-brand></a>
    <nav>
      <a href="#work" data-press>Work</a>
      <a href="#contact" data-press data-contact-link hidden>Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="stage" aria-label="Introduction">
      <div class="stage-copy">
        <h1 class="headline" data-headline></h1>
        <div class="stage-meta">
          <p class="role" data-role></p>
          <p class="status"><i></i><span data-status></span></p>
        </div>
      </div>
      <div class="reel" data-reel>
        <div class="reel-caption"><span>Showreel</span><span>Keep scrolling</span></div>
      </div>
    </section>

    <section class="intro"><p data-intro></p></section>

    <section id="work" class="work" data-work aria-label="Selected work"></section>

    <section id="contact" class="contact" data-contact hidden>
      <h2 class="contact-title"><span class="line"><span>Need UI for</span></span><span class="line"><span>your game?</span></span></h2>
      <p class="contact-sub">Message me on Discord and tell me about your project.</p>
      <button class="game-btn" type="button" data-copy><span class="game-btn-face"><span data-copy-label></span></span></button>
      <ul class="contact-links" data-links></ul>
    </section>
  </main>

  <footer class="foot"><span data-foot-name></span><a href="#top">Back to top</a></footer>

  <dialog class="lightbox" aria-label="Media viewer">
    <button class="lb-close" type="button" aria-label="Close"><span></span><span></span></button>
    <div class="lb-stage"></div>
  </dialog>

  <div class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem;color:#fff">This portfolio needs JavaScript to show its videos and animations.</p></noscript>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
